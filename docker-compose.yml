services:
  postgres:
    image: postgres:16-alpine
    container_name: messengers_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messengers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messengers}
      POSTGRES_DB: ${POSTGRES_DB:-messengers_analyze}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messengers} -d ${POSTGRES_DB:-messengers_analyze}"]
      interval: 10s
      timeout: 5s
      retries: 5

  listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messengers_listener
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the container Postgres is reachable by service name on port 5432.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-messengers}:${POSTGRES_PASSWORD:-messengers}@postgres:5432/${POSTGRES_DB:-messengers_analyze}
      # Keep the session file inside the persisted volume.
      TELETHON_SESSION: /app/telethon_data/telethon
    volumes:
      - ./telethon_data:/app/telethon_data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python /app/listener.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messengers_scheduler
    restart: unless-stopped
    command: ["python", "scheduler.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-messengers}:${POSTGRES_PASSWORD:-messengers}@postgres:5432/${POSTGRES_DB:-messengers_analyze}
      # Расписание: каждый день в 03:00 (можно переопределить в .env)
      SCHEDULE_ANALYSIS_CRON: ${SCHEDULE_ANALYSIS_CRON:-0 3 * * *}
      SCHEDULE_RUN_ON_START: ${SCHEDULE_RUN_ON_START:-false}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
